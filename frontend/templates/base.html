<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf_token() }}" />

    <title>Brewskers – {{ title }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Favicon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='layout.css') }}" />
  </head>

  <body class="{{ 'layout-topbar' if user.role not in ('admin', 'viewer') else 'layout-sidebar' }}">
    {% if user.role in ('admin', 'viewer') %}
      {% include "_sidebar.html" %}
      {% include "_topbar.html" %}
    {% else %}
      {% include "_topbar.html" %}
    {% endif %}

    <div class="frame">
      {% block page %}{% endblock %}
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    {% include "_profile_popup.html" %}

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block script %}{% endblock %}
  </body>
</html>
