{% macro page_header(eyebrow=None, title="", subtitle=None, action=None) %}
  <header class="page-header">
    <div class="page-header__text">
      {% if eyebrow %}<span class="eyebrow">{{ eyebrow }}</span>{% endif %}
      <h1>{{ title }}</h1>
      {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
    </div>
    {% if action is not none %}<div class="page-header__action">{{ action|safe }}</div>{% endif %}
  </header>
{% endmacro %}
