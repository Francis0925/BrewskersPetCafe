<style>
#apptPopup { position: fixed; inset: 0; z-index: 9999; display: none; }
#apptPopup.open { display: block; }
#apptPopup .backdrop { position: absolute; inset: 0; }
#apptPopup .sheet {
  position: absolute; top: 0; right: 0; height: 100%;
  width: min(400px, 100vw); overflow: hidden;
  box-shadow: -16px 0 48px rgba(45,32,24,.25);
}
#apptPopup .sheet .detail {
  position: static; width: auto; max-height: none; margin: 0;
  box-shadow: none; border: 0; border-radius: 0; display: block;
  background: var(--surface);
}
#apptPopup .close {
  position: absolute; top: 12px; right: 12px; z-index: 3;
  width: 34px; height: 34px; border: 1px solid var(--line-strong); border-radius: 50%;
  background: var(--surface); cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink);
  transition: transform 0.18s ease, background 0.18s ease;
}
#apptPopup .close:hover { background: var(--inset); transform: rotate(90deg); }
.pet, .list .item { cursor: pointer; }
</style>

<div id="apptPopup" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Appointment details">
  <div class="backdrop" data-close></div>
  <div class="sheet">
    <button class="close" type="button" aria-label="Close" data-close>×</button>
    <div class="panel detail" id="apptDetailBody"></div>
  </div>
</div>

<script>
(function () {
  const popup = document.getElementById("apptPopup");
  const body  = document.getElementById("apptDetailBody");
  document.body.appendChild(popup);

  const E = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const close = () => { popup.classList.remove("open"); popup.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; };

  window.renderApptDetail = function (a) {
    const day = new Date(a.appt_date + "T00:00").toLocaleDateString("en-PH",
      { weekday: "long", month: "short", day: "numeric", year: "numeric" });
    const name = a.pet_name || "?";
    const status = (a.status || "scheduled").toLowerCase();
    const statusClass = status === "completed" ? "ok" : status === "cancelled" ? "low" : "muted";
    const typeLine = [a.pet_type, a.breed].filter(Boolean).join(" · ");

    body.innerHTML = `
      <div class="appt-hero" ${a.photo ? `style="background-image:url('${E(a.photo)}')"` : ""}>
        <span class="appt-status badge ${statusClass}">${E(status)}</span>
        ${a.photo ? "" : E(name[0].toUpperCase())}
      </div>
      <div class="appt-body">
        <div class="appt-title">
          <div>
            <h3>${E(a.pet_name)}</h3>
            <p class="appt-meta">${E(typeLine || "Pet")} · ${E(a.service_name || "")}</p>
          </div>
        </div>
        <dl class="appt-grid">
          <div class="appt-box"><dt>Owner</dt><dd>${E(a.owner_name)}</dd></div>
          <div class="appt-box"><dt>Age</dt><dd>${E(a.pet_age || "-")}</dd></div>
          <div class="appt-box"><dt>Date</dt><dd>${E(day)}</dd></div>
          <div class="appt-box"><dt>Time</dt><dd>${E(a.appt_time)}</dd></div>
          <div class="appt-box"><dt>Service</dt><dd>${E(a.service_name)}</dd></div>
          <div class="appt-box"><dt>Phone</dt><dd><a href="tel:${E(a.phone)}">${E(a.phone)}</a></dd></div>
        </dl>
        <div class="micro">Guest notes</div>
        <p class="micro-body">${E(a.notes || "No notes yet.")}</p>
      </div>
      <div class="appt-actions">
        <button class="btn small" type="button" data-status="completed" data-id="${E(a.appointment_id)}">Mark done</button>
        <button class="btn danger small" type="button" data-status="cancelled" data-id="${E(a.appointment_id)}">Cancel</button>
        <button class="btn ghost small" type="button" data-print>Print card</button>
      </div>`;
    popup.classList.add("open");
    popup.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    const closeBtn = popup.querySelector(".close");
    if (closeBtn) closeBtn.focus();
  };

  popup.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) return close();
    if (e.target.closest("[data-print]")) return window.print();
    const b = e.target.closest("[data-status]");
    if (!b) return;
    if (typeof setStatus === "function") { close(); setStatus(+b.dataset.id, b.dataset.status); }
  });

  document.addEventListener("keydown", e => { if (e.key === "Escape" && popup.classList.contains("open")) close(); });
})();
</script>
