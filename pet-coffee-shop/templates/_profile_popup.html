<div class="popup-backdrop" id="popupBackdrop" onclick="closeProfilePopup()" hidden></div>

<aside class="popup" id="profilePopup" role="dialog" aria-labelledby="popupTitle" hidden>
  <header class="popup-head">
    <div class="popup-id">
      <div class="avatar lg">{{ user.username[0]|upper }}</div>
      <div class="popup-meta">
        <p id="popupTitle" class="popup-name">{{ user.username }}</p>
        <small class="popup-email">{{ user.email }}</small>
        <span class="popup-role">{{ user.role|capitalize }}</span>
      </div>
    </div>
    <a class="popup-full" href="/profile" title="View full profile" aria-label="View full profile">›</a>
  </header>

  <ul class="popup-list">
    <li>
      <a href="/profile">
        <span class="ic" aria-hidden="true">⚙</span>
        <span class="grow">Account settings</span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </li>
    <li>
      <a href="/profile#password">
        <span class="ic" aria-hidden="true">🔒</span>
        <span class="grow">Change password</span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </li>
    <li>
      <button type="button" onclick="toast('Appearance settings coming soon', 'info')">
        <span class="ic" aria-hidden="true">🌗</span>
        <span class="grow">Appearance</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </li>
    <li>
      <button type="button" onclick="toast('Notifications coming soon', 'info')">
        <span class="ic" aria-hidden="true">🔔</span>
        <span class="grow">Notifications</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </li>
    <li>
      <button type="button" onclick="toast('Help center coming soon', 'info')">
        <span class="ic" aria-hidden="true">❓</span>
        <span class="grow">Help &amp; shortcuts</span>
        <span class="chev" aria-hidden="true">›</span>
      </button>
    </li>

    {% if user.role == 'admin' %}
    <li class="popup-sep" aria-hidden="true"></li>
    <li>
      <a href="/admin/staff">
        <span class="ic" aria-hidden="true">🛠</span>
        <span class="grow">Admin tools</span>
        <span class="chev" aria-hidden="true">›</span>
      </a>
    </li>
    {% endif %}

    <li class="popup-sep" aria-hidden="true"></li>
    <li>
      <a class="danger" href="/logout">
        <span class="ic" aria-hidden="true">🚪</span>
        <span class="grow">Log out</span>
      </a>
    </li>
  </ul>
</aside>

<script>
  const popup         = document.getElementById("profilePopup");
  const popupBackdrop = document.getElementById("popupBackdrop");

  function openProfilePopup() {
    popup.hidden = false;
    popupBackdrop.hidden = false;
    requestAnimationFrame(() => popup.classList.add("open"));
  }
  function closeProfilePopup() {
    popup.classList.remove("open");
    setTimeout(() => {
      popup.hidden = true;
      popupBackdrop.hidden = true;
    }, 220);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !popup.hidden) closeProfilePopup();
  });
</script>
