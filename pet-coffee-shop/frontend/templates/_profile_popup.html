<div
  class="popup-backdrop"
  id="popupBackdrop"
  onclick="closeProfilePopup()"
  hidden
></div>

<aside
  class="popup"
  id="profilePopup"
  role="dialog"
  aria-labelledby="popupTitle"
  hidden
>
  <header class="popup-head">
    <div class="popup-id">
      <div class="avatar lg">
        {{ user.username[0]|upper }}
      </div>

      <div class="popup-meta">
        <p id="popupTitle" class="popup-name">
          {{ user.username }}
        </p>

        <small class="popup-email">
          {{ user.email }}
        </small>

        <span class="popup-role">
          {{ user.role|capitalize }}
        </span>
      </div>
    </div>
  </header>

  <div class="popup-section-label">
    My account
  </div>

  <ul class="popup-list">
    <li>
      <a href="/profile">
        <span
          class="popup-list-icon"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </span>

        <span class="grow">
          <strong>Profile &amp; security</strong>
          <small>Account details and password</small>
        </span>

        <span
          class="chev"
          aria-hidden="true"
        >
          ›
        </span>
      </a>
    </li>
  </ul>

  <li
    class="popup-sep"
    aria-hidden="true"
  ></li>

  <ul class="popup-list">
    <li>
      <a class="danger" href="/logout">
        <span
          class="popup-list-icon"
          aria-hidden="true"
        >
          <svg viewBox="0 0 24 24">
            <path d="M10 5H5v14h5" />
            <path d="M14 8l4 4-4 4M8 12h10" />
          </svg>
        </span>

        <span class="grow">
          <strong>Log out</strong>
          <small>End this staff session</small>
        </span>
      </a>
    </li>
  </ul>
</aside>

<script>
  const profilePopup =
    document.getElementById("profilePopup");

  const popupBackdrop =
    document.getElementById("popupBackdrop");

  let popupCloseTimer = null;

  function openProfilePopup() {
    clearTimeout(popupCloseTimer);

    profilePopup.hidden = false;
    popupBackdrop.hidden = false;

    requestAnimationFrame(() => {
      profilePopup.classList.add("open");
    });
  }

  function closeProfilePopup() {
    profilePopup.classList.remove("open");

    clearTimeout(popupCloseTimer);

    popupCloseTimer = setTimeout(() => {
      profilePopup.hidden = true;
      popupBackdrop.hidden = true;
    }, 220);
  }

  document.addEventListener("keydown", (event) => {
    if (
      event.key === "Escape" &&
      !profilePopup.hidden
    ) {
      closeProfilePopup();
    }
  });
</script>
