<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
 <form onsubmit="submitForm(event,'/api/appointments')"><h2>Set appointment</h2>
  <div class="two"><input name="pet_name" placeholder="Pet name" required>
   <select name="pet_type"><option>Dog</option><option>Cat</option></select></div>
  <div class="two"><input name="breed" placeholder="Breed"><input name="pet_age" placeholder="Age (e.g. 2 years)"></div>
  <div class="two"><input name="owner_name" placeholder="Owner name" required><input name="phone" placeholder="Phone" required></div>
  <select name="service_id" required>{% for s in services %}<option value="{{ s.service_id }}">{{ s.name }}</option>{% endfor %}</select>
  <div class="two"><input type="date" name="appt_date" required><input type="time" name="appt_time" required></div>
  <textarea name="notes" rows="2" placeholder="Guest notes"></textarea>
  <button class="btn green wide">Save appointment</button></form></div>
